<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kc-factory</title>
<style>
  :root {
    --bg: #fafaf8; --card: #ffffff; --text: #1c1c1a; --dim: #6b6b66; --line: #dcdcd6;
    --ready: #2f7a3a; --blocked: #a3141c; --warn: #7a4a00; --link: #1a5fb4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --card: #1f1f1d; --text: #ecece8; --dim: #9a9a94; --line: #34342f;
      --ready: #6cc07a; --blocked: #ff7b82; --warn: #e0a84a; --link: #7fb2ff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 16px; margin: 0 0 12px; }
  #status { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
  #cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; cursor: pointer; overflow-wrap: anywhere; }
  .card:focus-visible { outline: 2px solid var(--link); }
  .head { display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .key { font-weight: 700; }
  .stage-ready { color: var(--ready); }
  .stage-blocked, .stage-rejected { color: var(--blocked); }
  .stage-needs-info { color: var(--warn); }
  .dim { color: var(--dim); }
  a { color: var(--link); }
  .files { margin-top: 10px; border-top: 1px solid var(--line); padding-top: 8px; cursor: default; }
  .file h3 { font-size: 12px; margin: 8px 0 2px; color: var(--dim); }
  pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.4 ui-monospace, Menlo, monospace; }
  .summary { border-left: 3px solid var(--line); padding-left: 8px; margin-bottom: 4px; }
</style>
</head>
<body>
<h1>kc-factory</h1>
<div id="status">loading…</div>
<div id="cards"></div>
<script>
"use strict";
// Every job field and file text comes from tracker text or agent output, so it
// reaches the page through textContent only, never as markup.
var RUNNING = ["intake", "queued", "delivering"];
var FIXED_FILES = ["intake.md", "routing.json", "tracker.log", "blocked.md", "ticket.md"];
var MAX_FEEDBACK = 20;
var open = {};      // key -> true while its file list is expanded
var cache = {};     // key -> [{name, text}] fetched when opened

function el(tag, cls, text) {
  var node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function formatElapsed(ms) {
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60), h = Math.floor(m / 60);
  if (s < 60) return s + "s";
  if (m < 60) return m + "m";
  return h + "h " + (m % 60) + "m";
}

function elapsed(job) {
  var start = Date.parse(job.created_at);
  var end = RUNNING.indexOf(job.stage) >= 0 ? Date.now() : Date.parse(job.updated_at);
  if (isNaN(start) || isNaN(end)) return null;
  return Math.max(0, end - start);
}

// What a partial cost leaves out: run-wide agents (review prep, gates, shipping) no one job owns.
var PARTIAL_COST_NOTE = "agents shared across the run not included";

// A partial cost is a lower bound, so it reads "$X+".
function formatCost(c, partial) {
  if (typeof c !== "number") return "cost unavailable";
  return "$" + c.toFixed(2) + (partial === true ? "+" : "");
}

// The text of a file's "## Summary" section, or null when it has none.
function summaryOf(text) {
  var lines = text.split("\n"), out = [], inside = false;
  for (var i = 0; i < lines.length; i++) {
    if (/^##\s+Summary\s*$/i.test(lines[i])) { inside = true; continue; }
    if (inside && /^#{1,2}\s/.test(lines[i])) break;
    if (inside) out.push(lines[i]);
  }
  var summary = out.join("\n").trim();
  return summary === "" ? null : summary;
}

// Resolves to {text} on 200, {missing} on 404, {error} on anything else.
function fetchText(path) {
  return fetch(path, { cache: "no-store" }).then(function (r) {
    if (r.ok) return r.text().then(function (t) { return { text: t }; });
    return r.status === 404 ? { missing: true } : { error: "HTTP " + r.status };
  }).catch(function (e) { return { error: e.message }; });
}

function loadFiles(key) {
  var base = "jobs/" + encodeURIComponent(key) + "/";
  var found = [], failures = [];
  var fixed = FIXED_FILES.map(function (name) {
    return fetchText(base + name).then(function (r) {
      if (r.text !== undefined) found.push({ name: name, text: r.text });
      else if (r.error) failures.push(name + ": could not load (" + r.error + ")");
    });
  });
  // Directory listings are not available to a static page: probe feedback-1.md
  // upward until the first miss.
  var feedback = [];
  function probe(n) {
    if (n > MAX_FEEDBACK) return Promise.resolve();
    var name = "feedback-" + n + ".md";
    return fetchText(base + name).then(function (r) {
      if (r.error) failures.push(name + ": could not load (" + r.error + ")");
      if (r.text === undefined) return;
      feedback.push({ name: name, text: r.text });
      return probe(n + 1);
    });
  }
  return Promise.all(fixed.concat([probe(1)])).then(function () {
    found.sort(function (a, b) { return FIXED_FILES.indexOf(a.name) - FIXED_FILES.indexOf(b.name); });
    var all = found.concat(feedback);
    all.failures = failures;
    return all;
  });
}

function drawFiles(key, files) {
  var box = el("div", "files");
  (files.failures || []).forEach(function (m) { box.appendChild(el("div", "stage-blocked", m)); });
  if (files.length === 0 && (files.failures || []).length === 0) box.appendChild(el("div", "dim", "no files yet"));
  files.forEach(function (f) {
    var wrap = el("div", "file");
    wrap.appendChild(el("h3", null, f.name));
    var summary = summaryOf(f.text);
    if (summary !== null) wrap.appendChild(el("pre", "summary", summary));
    wrap.appendChild(el("pre", null, f.text));
    box.appendChild(wrap);
  });
  return box;
}

function drawCard(job) {
  var card = el("div", "card");
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  var head = el("div", "head");
  head.appendChild(el("span", "key", job.key));
  head.appendChild(el("span", "stage-" + String(job.stage).replace(/[^a-z-]/g, ""), job.stage));
  var ms = elapsed(job);
  if (ms !== null) head.appendChild(el("span", "dim", formatElapsed(ms)));
  card.appendChild(head);
  if (job.title !== undefined) card.appendChild(el("div", null, job.title));
  var details = [];
  if (job.risk !== undefined) details.push("risk " + job.risk);
  if (Array.isArray(job.surfaces) && job.surfaces.length > 0) details.push(job.surfaces.join(", "));
  var detailLine = el("div", "dim", details.length > 0 ? details.join(" · ") + " · " : "");
  var cost = el("span", null, formatCost(job.cost_usd, job.cost_partial));
  if (job.cost_partial === true && typeof job.cost_usd === "number") {
    cost.title = PARTIAL_COST_NOTE;
    cost.setAttribute("aria-label", cost.textContent + " (" + PARTIAL_COST_NOTE + ")");
  }
  detailLine.appendChild(cost);
  card.appendChild(detailLine);
  if (job.reason !== undefined) card.appendChild(el("div", "dim", job.reason));
  if (job.pr_url !== undefined) {
    var url = String(job.pr_url);
    if (url.indexOf("https://") === 0) {
      var a = el("a", null, url);
      a.href = url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.addEventListener("click", function (e) { e.stopPropagation(); });
      card.appendChild(el("div")).appendChild(a);
    } else {
      card.appendChild(el("div", "dim", url));
    }
  }
  if (open[job.key] && cache[job.key]) card.appendChild(drawFiles(job.key, cache[job.key]));
  function toggle() {
    if (open[job.key]) { delete open[job.key]; render(lastJobs); return; }
    open[job.key] = true;
    loadFiles(job.key).then(function (files) { cache[job.key] = files; render(lastJobs); });
  }
  card.addEventListener("click", function (e) {
    if (e.target.closest && e.target.closest(".files")) return;
    toggle();
  });
  card.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
  });
  return card;
}

var lastJobs = [];
function render(jobs) {
  lastJobs = jobs;
  var cards = document.getElementById("cards");
  cards.replaceChildren();
  jobs.forEach(function (job) { cards.appendChild(drawCard(job)); });
}

function refresh() {
  var status = document.getElementById("status");
  fetch("jobs/index.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (jobs) {
      status.textContent = jobs.length === 0 ? "no jobs yet" : jobs.length + " job(s), refreshed every 5s";
      // Refresh open file lists too, so a running job's tracker.log stays current.
      return Promise.all(Object.keys(open).map(function (key) {
        return loadFiles(key).then(function (files) { cache[key] = files; });
      })).then(function () { render(jobs); });
    })
    .catch(function (err) { status.textContent = "cannot read jobs/index.json: " + err.message; });
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
